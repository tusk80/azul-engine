name: Site

# Builds the static site (page + engine as WebAssembly) and publishes it to
# the "pages" branch. A static host such as Cloudflare Pages serves that
# branch as-is: no build step and no server on their side.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build site
        run: bash scripts/build-site.sh site
      # Layout of the pages branch: wrangler.jsonc at the root, the site in
      # public/. Cloudflare deploys it with "npx wrangler deploy"; any other
      # static host can serve public/ directly.
      - name: Publish to the pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          mv site out/public
          cp hosting/wrangler.jsonc out/
          cd out
          git init -q -b pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
